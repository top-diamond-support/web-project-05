<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Solution | Logo Guidelines</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #e9e7e2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  padding: 20px;
}

h1 {
  font-size: 18px;
  font-weight: 500;
  color: #333;
  margin: 0 0 24px;
}

#book {
  width: min(92vw, 1000px);
  margin: 0 auto;
}

#book .page {
  background: white;
  overflow: hidden;
}

#book .page img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 24px;
}

button {
  padding: 10px 20px;
  border: 1px solid #aaa;
  border-radius: 4px;
  background: white;
  color: #333;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.4;
  cursor: default;
}

#counter {
  min-width: 55px;
  text-align: center;
  color: #555;
  font-size: 14px;
}

.hint {
  margin-top: 12px;
  color: #777;
  font-size: 12px;
}

@media (max-width: 600px) {
  body {
    padding: 12px;
  }

  h1 {
    font-size: 16px;
    margin-bottom: 18px;
  }

  .controls {
    gap: 10px;
    margin-top: 18px;
  }

  button {
    padding: 9px 14px;
  }
}
</style>
</head>

<body>

<h1>Enjoy Baseball Japan ロゴ仕様書</h1>

<div id="book">
  <div class="page"><img src="1.jpg" alt="1ページ目"></div>
  <div class="page"><img src="2.jpg" alt="2ページ目"></div>
  <div class="page"><img src="3.jpg" alt="3ページ目"></div>
  <div class="page"><img src="4.jpg" alt="4ページ目"></div>
  <div class="page"><img src="5.jpg" alt="5ページ目"></div>
  <div class="page"><img src="6.jpg" alt="6ページ目"></div>
  <div class="page"><img src="7.jpg" alt="7ページ目"></div>
</div>

<div class="controls">
  <button id="prev" type="button">← 前へ</button>
  <span id="counter">1 / 8</span>
  <button id="next" type="button">次へ →</button>
</div>

<p class="hint">ページの端をドラッグしてめくることもできます</p>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<script>
const bookElement = document.getElementById("book");
const counter = document.getElementById("counter");
const prevButton = document.getElementById("prev");
const nextButton = document.getElementById("next");

const pageFlip = new St.PageFlip(bookElement, {
  width: 700,
  height: 495,
  size: "stretch",
  minWidth: 280,
  maxWidth: 1000,
  minHeight: 198,
  maxHeight: 707,
  showCover: false,
  maxShadowOpacity: 0.45,
  mobileScrollSupport: false,
  flippingTime: 900,
  usePortrait: true,
  startPage: 0,
  drawShadow: true,
  autoSize: true
});

pageFlip.loadFromHTML(
  document.querySelectorAll("#book .page")
);

function updateControls() {
  const current = pageFlip.getCurrentPageIndex();
  const total = pageFlip.getPageCount();

  counter.textContent = `${current + 1} / ${total}`;
  prevButton.disabled = current === 0;
  nextButton.disabled = current === total - 1;
}

pageFlip.on("flip", updateControls);

prevButton.addEventListener("click", () => {
  pageFlip.flipPrev();
});

nextButton.addEventListener("click", () => {
  pageFlip.flipNext();
});

updateControls();
</script>

</body>
</html>
